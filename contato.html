<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="assets/css/template.css">
  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
  <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" type="text/css" rel="stylesheet">
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable = no">
  <title>LEAL - Contato</title>
  <link rel="icon" href="assets/img/leal2.png" type="image/x-icon">
</head>
<body>

<body>
  <div id="navbar-container"></div>
  
  <section class="mx-auto mt-5 col-xl-9 text-justify">
      <form id="contato" class="gt-form medium" action="https://formspree.io/mzblqvrp" method="post">
        <input type="hidden" name="_format" value="plain" />
        <input type="hidden" name="_language" value="pt-BR" />
        <div class="p-2 row w-100">
          <input required type="text" name="name"  placeholder="Nome" class="mx-2 col-sm-4"><br>
          <input required type="email" name="email" placeholder="E-mail" class="mx-2 col-sm-4"/>
          <input required type="text" name="_subject" placeholder="Assunto" class="mx-2 mt-2 col-sm-4"/>
        </div>
        <textarea required name="body" rows="4" cols="80" placeholder="Mensagem" class=" my-2 col-sm-8"></textarea>
        <div >
          <button type="submit" name="button" class="btn btn-info my-2">Enviar</button>
          <button type="reset" class="btn btn-info my-2" > Limpar </button>
        </div>
      </form>
      <p class="text-lightsecondary"><i class="fa fa-map-marker"></i> Laboratório de Energias alternativas
      <br>Departamento de Tecnologia Industrial
      <br>Centro Tecnológico-UFES
      <br>Av. Fernando Ferrari, 514, Goiabeiras, Vitória-ES - CEP 29075-910</p>
      <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1rrTl1NgNNLZxtCt-vmzLGZfPR-I9qpn6" width="640" height="280"></iframe>
  </section><hr>
    <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Injeta Navbar
            fetch('html/navbar.html')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar a navbar');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // 2. Cria dinamicamente o script do Bootstrap 5.3 para evitar conflitos nativos de componentes
                    const scriptBootstrap = document.createElement('script');
                    scriptBootstrap.src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js";
                    document.body.appendChild(scriptBootstrap);
                })
                .catch(error => console.error(error));

            // 3. Injeta Footer
            fetch('html/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar o footer');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                })
                .catch(error => console.error(error));
        });
    </script>

</body>
</html>
