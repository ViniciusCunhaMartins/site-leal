<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="assets/css/template.css">
  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
  <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" type="text/css" rel="stylesheet">
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable = no">
  <title>LEAL - Projetos</title>
  <link rel="icon" href="assets/img/leal2.png" type="image/x-icon">
</head>
<body>
  <div id="navbar-container"></div>   
  
  <section class="mx-auto mt-5 col-xl-9 text-justify">

  	<h2 class="text-muted" id="projects">Projetos</h2><hr>
    <h1 class="text-lightsecondary">Em construção</h1>
    <img src="assets/img/construct.png"/>

   </section>
    <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Injeta Navbar
            fetch('html/navbar.html')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar a navbar');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // 2. Cria dinamicamente o script do Bootstrap 5.3 para evitar conflitos nativos de componentes
                    const scriptBootstrap = document.createElement('script');
                    scriptBootstrap.src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js";
                    document.body.appendChild(scriptBootstrap);
                })
                .catch(error => console.error(error));

            // 3. Injeta Footer
            fetch('html/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar o footer');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                })
                .catch(error => console.error(error));
        });
    </script>

</body>
</html>
